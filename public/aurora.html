<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #020b06;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /*
    AURORA COMPONENT
    ─────────────────────────────────────────
    Usage: Place .aurora-bg as a child of any positioned container.
    It uses position:absolute + inset:0 so it fills its parent.
    Set the parent to position:relative and overflow:hidden.
    Content goes above via z-index.

    Performance notes:
    - All animation on transform + opacity only (GPU composited)
    - No layout/paint triggers in animation loops
    - will-change hints for compositor promotion
    - Single container, no JS, pure CSS
  */

  .aurora-bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    background: linear-gradient(
      180deg,
      #010d04 0%,
      #021a08 20%,
      #03120a 50%,
      #060e0a 80%,
      #0a0c0b 100%
    );
  }

  /* Shared ribbon base */
  .aurora-bg .ribbon {
    position: absolute;
    width: 200%;
    left: -50%;
    border-radius: 50%;
    opacity: 0;
    will-change: transform, opacity;
    mix-blend-mode: screen;
    pointer-events: none;
  }

  /* ── Ribbon 1: Wide soft emerald sweep ── */
  .aurora-bg .r1 {
    top: 8%;
    height: 45%;
    background: radial-gradient(
      ellipse 80% 50% at 50% 50%,
      rgba(0, 255, 100, 0.18) 0%,
      rgba(0, 200, 80, 0.12) 25%,
      rgba(0, 140, 60, 0.06) 50%,
      transparent 75%
    );
    filter: blur(40px);
    animation: drift-1 12s ease-in-out infinite;
  }

  /* ── Ribbon 2: Narrow bright band ── */
  .aurora-bg .r2 {
    top: 15%;
    height: 25%;
    background: radial-gradient(
      ellipse 60% 40% at 50% 50%,
      rgba(100, 255, 160, 0.22) 0%,
      rgba(50, 230, 120, 0.14) 30%,
      rgba(0, 180, 80, 0.06) 60%,
      transparent 80%
    );
    filter: blur(25px);
    animation: drift-2 10s ease-in-out infinite 1s;
  }

  /* ── Ribbon 3: Teal-green accent ── */
  .aurora-bg .r3 {
    top: 5%;
    height: 35%;
    background: radial-gradient(
      ellipse 70% 45% at 50% 50%,
      rgba(0, 220, 180, 0.15) 0%,
      rgba(0, 180, 140, 0.08) 35%,
      rgba(0, 120, 90, 0.04) 60%,
      transparent 80%
    );
    filter: blur(35px);
    animation: drift-3 14s ease-in-out infinite 2.5s;
  }

  /* ── Ribbon 4: Deep green low band ── */
  .aurora-bg .r4 {
    top: 25%;
    height: 40%;
    background: radial-gradient(
      ellipse 90% 55% at 50% 50%,
      rgba(0, 160, 60, 0.12) 0%,
      rgba(0, 120, 50, 0.07) 30%,
      rgba(0, 80, 30, 0.03) 60%,
      transparent 80%
    );
    filter: blur(50px);
    animation: drift-4 16s ease-in-out infinite 0.5s;
  }

  /* ── Ribbon 5: Bright lime highlight ── */
  .aurora-bg .r5 {
    top: 12%;
    height: 20%;
    background: radial-gradient(
      ellipse 50% 35% at 50% 50%,
      rgba(140, 255, 100, 0.16) 0%,
      rgba(80, 220, 60, 0.08) 40%,
      transparent 70%
    );
    filter: blur(20px);
    animation: drift-5 11s ease-in-out infinite 3.5s;
  }

  /* ── Ribbon 6: Faint mint upper glow ── */
  .aurora-bg .r6 {
    top: 0%;
    height: 30%;
    background: radial-gradient(
      ellipse 100% 60% at 50% 40%,
      rgba(150, 255, 200, 0.08) 0%,
      rgba(80, 200, 140, 0.04) 40%,
      transparent 70%
    );
    filter: blur(60px);
    animation: drift-6 18s ease-in-out infinite 1.5s;
  }

  /* ── Star field (subtle) ── */
  .aurora-bg .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 40% 22%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 85% 12%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1px 1px at 15% 35%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 33% 3%, rgba(200,255,220,0.6), transparent),
      radial-gradient(1.5px 1.5px at 78% 9%, rgba(200,255,220,0.5), transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
    pointer-events: none;
  }

  /*
    ═══════ ANIMATIONS ═══════
    All use transform (translateX/scaleX/scaleY) + opacity only.
    No width/height/top/left changes = no layout recalc.
  */

  @keyframes drift-1 {
    0%   { transform: translateX(-15%) scaleX(1) scaleY(1); opacity: 0.5; }
    20%  { transform: translateX(-5%) scaleX(1.1) scaleY(0.9); opacity: 0.8; }
    40%  { transform: translateX(10%) scaleX(0.9) scaleY(1.1); opacity: 0.6; }
    60%  { transform: translateX(18%) scaleX(1.05) scaleY(0.95); opacity: 0.9; }
    80%  { transform: translateX(5%) scaleX(0.95) scaleY(1.05); opacity: 0.7; }
    100% { transform: translateX(-15%) scaleX(1) scaleY(1); opacity: 0.5; }
  }

  @keyframes drift-2 {
    0%   { transform: translateX(20%) scaleX(1) scaleY(1); opacity: 0.4; }
    25%  { transform: translateX(5%) scaleX(1.15) scaleY(0.85); opacity: 0.85; }
    50%  { transform: translateX(-15%) scaleX(0.85) scaleY(1.15); opacity: 0.55; }
    75%  { transform: translateX(-5%) scaleX(1.1) scaleY(0.9); opacity: 0.8; }
    100% { transform: translateX(20%) scaleX(1) scaleY(1); opacity: 0.4; }
  }

  @keyframes drift-3 {
    0%   { transform: translateX(-10%) scaleX(1) scaleY(1); opacity: 0.3; }
    30%  { transform: translateX(12%) scaleX(1.2) scaleY(0.8); opacity: 0.75; }
    60%  { transform: translateX(-8%) scaleX(0.9) scaleY(1.1); opacity: 0.5; }
    100% { transform: translateX(-10%) scaleX(1) scaleY(1); opacity: 0.3; }
  }

  @keyframes drift-4 {
    0%   { transform: translateX(8%) scaleX(1) scaleY(1); opacity: 0.4; }
    35%  { transform: translateX(-12%) scaleX(1.1) scaleY(0.9); opacity: 0.7; }
    65%  { transform: translateX(15%) scaleX(0.9) scaleY(1.1); opacity: 0.5; }
    100% { transform: translateX(8%) scaleX(1) scaleY(1); opacity: 0.4; }
  }

  @keyframes drift-5 {
    0%   { transform: translateX(-20%) scaleX(1); opacity: 0.3; }
    30%  { transform: translateX(0%) scaleX(1.2); opacity: 0.7; }
    50%  { transform: translateX(15%) scaleX(0.85); opacity: 0.9; }
    70%  { transform: translateX(5%) scaleX(1.1); opacity: 0.5; }
    100% { transform: translateX(-20%) scaleX(1); opacity: 0.3; }
  }

  @keyframes drift-6 {
    0%   { transform: translateX(5%) scaleX(1); opacity: 0.2; }
    50%  { transform: translateX(-10%) scaleX(1.15); opacity: 0.5; }
    100% { transform: translateX(5%) scaleX(1); opacity: 0.2; }
  }

  @keyframes twinkle {
    0%   { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* ═══════ DEMO LAYOUT ═══════ */

  .demo-card {
    position: relative;
    width: 700px;
    max-width: 92vw;
    height: 500px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(100, 255, 160, 0.12);
    box-shadow:
      0 0 60px rgba(0, 200, 100, 0.08),
      0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .demo-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 3rem;
    text-align: center;
    color: rgba(200, 255, 220, 0.9);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .demo-content h1 {
    font-size: 2.4rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1rem;
    text-shadow: 0 0 30px rgba(0, 255, 120, 0.3);
  }

  .demo-content p {
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    opacity: 0.6;
    max-width: 400px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <!-- Demo: aurora as a component background -->
  <div class="demo-card">

    <!-- ✂ AURORA COMPONENT — copy this block into any positioned container -->
    <div class="aurora-bg">
      <div class="stars"></div>
      <div class="ribbon r1"></div>
      <div class="ribbon r2"></div>
      <div class="ribbon r3"></div>
      <div class="ribbon r4"></div>
      <div class="ribbon r5"></div>
      <div class="ribbon r6"></div>
    </div>
    <!-- ✂ END AURORA -->

    <div class="demo-content">
      <h1>Aurora Borealis</h1>
      <p>Pure CSS · GPU composited · loops seamlessly · drop into any component</p>
    </div>
  </div>

</body>
</html>
