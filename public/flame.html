<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Fire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    min-height: 100vh;
    background: #050d05;
    overflow: hidden;
  }

  .fire-pit {
    position: relative;
    width: 400px;
    height: 380px;
    margin-bottom: 40px;
  }

  .logs {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 30px;
    background: radial-gradient(ellipse, rgba(0,60,0,0.8) 0%, rgba(0,30,0,0.4) 60%, transparent 100%);
    border-radius: 50%;
    z-index: 10;
  }

  .ground-glow {
    position: absolute;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 80px;
    background: radial-gradient(ellipse, rgba(0,255,60,0.25) 0%, rgba(0,180,40,0.1) 40%, transparent 70%);
    filter: blur(15px);
    z-index: 0;
  }

  .flame {
    position: absolute;
    bottom: 10px;
    left: 50%;
    border-radius: 50% 50% 30% 30%;
    filter: blur(6px);
    transform-origin: bottom center;
  }

  .flame.core {
    width: 40px; height: 90px;
    background: radial-gradient(ellipse at 50% 80%, #eeffee 0%, #aaffaa 15%, #44ff66 35%, #00cc33 55%, transparent 100%);
    z-index: 8;
    animation: core-dance 0.3s ease-in-out infinite alternate;
  }
  .flame.inner {
    width: 70px; height: 140px;
    background: radial-gradient(ellipse at 50% 75%, #ccffcc 0%, #33ff66 15%, #00dd44 35%, #009922 60%, transparent 100%);
    z-index: 7;
    animation: inner-dance 0.35s ease-in-out infinite alternate;
  }
  .flame.main {
    width: 110px; height: 190px;
    background: radial-gradient(ellipse at 50% 70%, #66ff88 0%, #22cc44 20%, #009933 45%, #006622 65%, transparent 100%);
    z-index: 6;
    animation: main-dance 0.45s ease-in-out infinite alternate;
  }
  .flame.outer {
    width: 160px; height: 230px;
    background: radial-gradient(ellipse at 50% 70%, rgba(0,200,60,0.6) 0%, rgba(0,140,40,0.4) 30%, rgba(0,80,20,0.2) 60%, transparent 100%);
    z-index: 5;
    filter: blur(12px);
    animation: outer-dance 0.55s ease-in-out infinite alternate;
  }



  .spark {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #aaffcc;
    filter: blur(1px);
    z-index: 12;
    bottom: 100px;
  }
  .spark:nth-child(1) { left: 42%; animation: spark-rise 1.0s ease-out infinite 0.0s; --drift: 0.2; }
  .spark:nth-child(2) { left: 52%; animation: spark-rise 1.3s ease-out infinite 0.2s; --drift: 0.7; }
  .spark:nth-child(3) { left: 48%; animation: spark-rise 0.9s ease-out infinite 0.5s; --drift: 0.4; }
  .spark:nth-child(4) { left: 56%; animation: spark-rise 1.4s ease-out infinite 0.1s; --drift: 0.9; }
  .spark:nth-child(5) { left: 38%; animation: spark-rise 1.1s ease-out infinite 0.7s; --drift: 0.1; }

  @keyframes core-dance {
    0%   { transform: translateX(-50%) scaleX(1) scaleY(1) rotate(-1deg); }
    33%  { transform: translateX(-52%) scaleX(0.9) scaleY(1.06) rotate(2deg); }
    66%  { transform: translateX(-48%) scaleX(1.05) scaleY(0.95) rotate(-1.5deg); }
    100% { transform: translateX(-50%) scaleX(0.95) scaleY(1.04) rotate(1deg); }
  }
  @keyframes inner-dance {
    0%   { transform: translateX(-50%) scaleX(1) scaleY(1) rotate(1deg); }
    50%  { transform: translateX(-53%) scaleX(0.92) scaleY(1.08) rotate(-2deg); }
    100% { transform: translateX(-47%) scaleX(1.04) scaleY(0.96) rotate(1.5deg); }
  }
  @keyframes main-dance {
    0%   { transform: translateX(-50%) scaleX(1) scaleY(1) rotate(-0.5deg); }
    50%  { transform: translateX(-51%) scaleX(1.05) scaleY(0.95) rotate(1.5deg); }
    100% { transform: translateX(-49%) scaleX(0.96) scaleY(1.06) rotate(-1deg); }
  }
  @keyframes outer-dance {
    0%   { transform: translateX(-50%) scale(1); opacity: 0.7; }
    100% { transform: translateX(-50%) scale(1.06); opacity: 0.9; }
  }


  @keyframes spark-rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
    50%  { opacity: 0.8; }
    100% { transform: translateY(-200px) translateX(calc(-20px + 40px * var(--drift, 0.5))) scale(0); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="fire-pit">
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>


    <div class="flame outer"></div>
    <div class="flame main"></div>
    <div class="flame inner"></div>
    <div class="flame core"></div>

    <div class="logs"></div>
    <div class="ground-glow"></div>
  </div>
</body>
</html>
